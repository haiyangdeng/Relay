name: Publish introduction site (manual)

# Only an explicit future Actions -> Run workflow publishes this site.
# Preparing or pushing source code does not trigger a deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check static entry and release data
        run: |
          test -f site/index.html
          test -f site/app.mjs
          python3 -m json.tool site/releases.json > /dev/null
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload site only
        id: upload
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            // Deploy the exact upload without relying on the name-based artifact listing.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID)
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) throw new Error('Missing artifact ID')
            const oidc = await core.getIDToken()
            core.setSecret(oidc)
            const route = '/repos/{owner}/{repo}/pages/deployments'
            const { data } = await github.request('POST ' + route, {
              ...context.repo, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: oidc
            })
            const deployment = { ...context.repo, deployment_id: data.id }
            const statusRoute = route + '/{deployment_id}'
            const deadline = Date.now() + 7 * 60_000
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 5000))
              let status
              try {
                const response = await github.request('GET ' + statusRoute, deployment)
                status = response.data.status
              } catch (error) {
                if (error.status === 404 || error.status >= 500) continue
                throw error
              }
              core.info('Pages deployment: ' + status)
              if (status === 'succeed') {
                core.setOutput('page_url', data.page_url)
                return
              }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(status)) {
                throw new Error('Pages deployment ended with ' + status)
              }
            }
            await github.request('POST ' + statusRoute + '/cancel', deployment)
            throw new Error('Timed out waiting for GitHub Pages')
